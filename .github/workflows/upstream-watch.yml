# 每周比对上游 rime-ice README，变更时开 issue 提醒核对本地文档（README 速查表 / AGENTS.md 速查）
name: upstream-watch

on:
  schedule:
    - cron: "0 3 * * 1" # 每周一 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 比对上游 README 哈希
        id: cmp
        run: |
          sha=$(curl -fsSL https://raw.githubusercontent.com/iDvel/rime-ice/main/README.md | sha256sum | cut -d' ' -f1)
          old=$(cat .upstream-watch.sha 2>/dev/null || echo none)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [ "$sha" != "$old" ]; then echo "changed=yes" >> "$GITHUB_OUTPUT"; else echo "changed=no" >> "$GITHUB_OUTPUT"; fi

      - name: 更新哈希记录
        if: steps.cmp.outputs.changed == 'yes'
        run: echo "${{ steps.cmp.outputs.sha }}" > .upstream-watch.sha

      - name: 开 issue 提醒核对文档
        if: steps.cmp.outputs.changed == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '上游 rime-ice README 有更新，请核对本地文档',
              body: [
                '上游 [rime-ice README](https://github.com/iDvel/rime-ice/blob/main/README.md) 内容发生变化。',
                '',
                '请核对：',
                '1. README「使用速查」表：触发前缀/功能说明是否仍准确',
                '2. AGENTS.md「上游能力速查」一节',
                '3. 是否需要更新上游文件（新词库/新功能）',
                '',
                '核对完成后关闭本 issue。'
              ].join('\n')
            })

      - name: 提交哈希更新
        if: steps.cmp.outputs.changed == 'yes'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .upstream-watch.sha
          git commit -m "chore: upstream-watch 记录上游 README 新哈希"
          git push
